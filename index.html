  <style>
:root {
  --bg: #f3f6f4;
  --panel: #ffffff;
  --text: #17211c;
  --muted: #66736b;
  --border: #dce5df;
  --green: #176b45;
  --green-dark: #0f5132;
  --green-soft: #e8f4ed;
  --blue: #2563eb;
  --orange: #d97706;
  --red: #c83b3b;
  --purple: #7c3aed;
  --shadow: 0 12px 32px rgba(24, 58, 40, .08);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; color: var(--text); background: var(--bg); }
button, input, select { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; background: linear-gradient(180deg,#0d4f32,#133d2c); color: #fff; padding: 22px 16px; display: flex; flex-direction: column; z-index: 10; }
.brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 24px; }
.brand-mark { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; font-weight: 700; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); }
.brand h1 { margin: 0; font-size: 16px; line-height: 1.4; }
.brand p { margin: 5px 0 0; color: rgba(255,255,255,.65); font-size: 12px; }
.nav-list { display: grid; gap: 8px; }
.nav-item { border: 0; background: transparent; color: rgba(255,255,255,.72); text-align: left; padding: 12px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; transition: .2s ease; }
.nav-item span { width: 20px; text-align: center; font-size: 18px; }
.nav-item:hover, .nav-item.active { background: rgba(255,255,255,.12); color: #fff; }
.sidebar-footer { margin-top: auto; display: grid; gap: 12px; }
.privacy-note { padding: 12px; border-radius: 12px; background: rgba(255,255,255,.08); display: grid; gap: 4px; }
.privacy-note span { font-size: 11px; color: rgba(255,255,255,.62); }
.main { min-width: 0; }
.topbar { min-height: 88px; padding: 18px 28px; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 8; backdrop-filter: blur(12px); }
.topbar h2 { margin: 0; font-size: 23px; }
.topbar p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
.top-actions, .inline-actions, .empty-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rule-badge { color: var(--green-dark); background: var(--green-soft); padding: 7px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.page { display: none; padding: 24px 28px 38px; }
.page.active { display: block; }
.panel { background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
.panel-header { margin-bottom: 16px; }
.panel-header-row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.panel h3, .panel h4 { margin: 0; }
.panel-header p { color: var(--muted); margin: 5px 0 0; font-size: 13px; }
.btn { border: 1px solid transparent; border-radius: 10px; padding: 9px 14px; font-weight: 700; transition: .15s ease; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-dark); }
.btn-secondary { color: var(--green-dark); border-color: #b9cfc1; background: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-text { padding: 7px 4px; color: var(--green); background: transparent; }
.btn-block { width: 100%; }
.kpi-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 16px; margin-bottom: 20px; }
.kpi-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; position: relative; overflow: hidden; }
.kpi-card::after { content:""; position: absolute; right: -22px; bottom: -34px; width: 88px; height: 88px; border-radius: 50%; background: var(--tone,#e8f4ed); }
.kpi-label { color: var(--muted); font-size: 13px; }
.kpi-value { margin-top: 10px; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
.kpi-sub { margin-top: 6px; color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; }
.chart-area { min-height: 310px; display: grid; place-items: center; }
.donut-layout { width: 100%; display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: center; }
.donut { width: 210px; height: 210px; border-radius: 50%; position: relative; margin: auto; }
.donut::after { content:""; position: absolute; inset: 42px; background: #fff; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--border); }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; z-index: 1; }
.donut-center strong { font-size: 30px; }
.donut-center span { color: var(--muted); font-size: 12px; }
.legend { display: grid; gap: 11px; }
.legend-item { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }
.legend-value { font-weight: 700; }
.radar-svg { width: 100%; max-width: 430px; height: 300px; overflow: visible; }
.radar-grid { fill: none; stroke: #dce6df; stroke-width: 1; }
.radar-axis { stroke: #e3ebe6; stroke-width: 1; }
.radar-data { fill: rgba(23,107,69,.23); stroke: var(--green); stroke-width: 2.5; }
.radar-dot { fill: var(--green); }
.radar-label { font-size: 12px; fill: #506159; font-weight: 700; }
.bars-chart { display: grid; gap: 14px; min-height: 280px; align-content: start; padding-top: 10px; }
.bar-row { display: grid; grid-template-columns: 94px 1fr 54px; gap: 10px; align-items: center; font-size: 12px; }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 13px; background: #edf2ef; border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg,#2a8b5c,#75b391); }
.bar-value { text-align: right; font-weight: 800; }
.risk-summary { min-height: 280px; display: grid; align-content: start; gap: 16px; }
.risk-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.risk-card { border-radius: 12px; padding: 16px; border: 1px solid var(--border); background: #fafcfb; }
.risk-card strong { display: block; font-size: 24px; margin-top: 8px; }
.dashboard-section { margin-bottom: 20px; }
.dashboard-section-title { margin: 0 0 12px; display: flex; align-items: center; gap: 9px; font-size: 14px; color: #425149; }
.dashboard-section-title::before { content:""; width: 4px; height: 16px; border-radius: 2px; background: var(--green); }
.dashboard-filter-bar { margin-bottom: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.dashboard-filter-title { min-width: 150px; }
.dashboard-filter-title strong { display: block; font-size: 14px; color: var(--text); }

.dashboard-filter-fields label { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
.dashboard-filter-fields select { width: 100%; height: 38px; padding: 0 30px 0 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); font: inherit; }

.dashboard-chart { width: 100%; height: 320px; }

.station-summary span { display: block; color: var(--muted); font-size: 11px; }
.station-summary strong { display: block; margin-top: 4px; font-size: 15px; }

.template-card p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }

.import-options { display: flex; gap: 20px; margin: 14px 0; font-size: 13px; }
.import-status { border-radius: 10px; padding: 11px 12px; font-size: 13px; }

.data-table th { background: #f2f6f3; color: #405048; text-align: left; padding: 11px 12px; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
.data-table td { padding: 11px 12px; border-top: 1px solid #e7ede9; vertical-align: middle; }

.badge-warning { background: #fff1e6; color: #a95a13; }

.badge-high { background: #ffecec; color: #b83232; }
.badge-medium { background: #fff5dc; color: #a36900; }
.badge-low { background: #eaf7ef; color: #27754d; }

.action-link { color: var(--green); font-weight: 800; border: 0; background: transparent; padding: 4px; }
